services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicconnect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - civicconnect_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicconnect}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME:?Set MIGRATION_DB_USERNAME in .env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
      AUTH_MODE: ${AUTH_MODE:-legacy}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-civicconnect-3ed04}
      GOOGLE_APPLICATION_CREDENTIALS: /run/civic-secrets/firebase-service-account.json
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_NOTIFICATIONS_ENABLED: ${BREVO_NOTIFICATIONS_ENABLED:-false}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-CivicConnect}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-inl2group13@gmail.com}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO:-inl2group13@gmail.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8085}
      CIVICCONNECT_LOGO_URL: ${CIVICCONNECT_LOGO_URL:-}
    volumes:
      - ./secrets:/run/civic-secrets:ro
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_AUTH_MODE: ${AUTH_MODE:-legacy}
        VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-civicconnect-3ed04}
        VITE_FIREBASE_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-civicconnect-3ed04.firebaseapp.com}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api

volumes:
  civicconnect_pgdata: