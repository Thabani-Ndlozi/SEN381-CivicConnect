name: CivicConnect CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend when tests exist
        working-directory: frontend
        shell: bash
        run: |
          if find src -name "*.test.ts" -o -name "*.test.tsx" | grep -q .; then
            npm test
          else
            echo "Frontend tests have not been integrated yet."
            echo "Skipping frontend tests during bootstrap integration."
          fi

      - name: Build frontend when application exists
        working-directory: frontend
        shell: bash
        run: |
          if [ -f src/main.tsx ]; then
            npm run build
          else
            echo "Frontend application source has not been integrated yet."
            echo "Skipping frontend build during bootstrap integration."
          fi